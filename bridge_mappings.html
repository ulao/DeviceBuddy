<html lang="en">
<head>
<meta charset="UTF-8">

<title>Bliss-Box Controller Mapping</title>
<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#eee;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}

.page {
  width:1100px;
  max-width:calc(100vw - 24px);
  margin:24px auto;
  background:#fff;
  border:1px solid #aaa;
}

.header {
  padding:18px 24px 20px;
  border-bottom:3px solid #222;
}

.header-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  margin-bottom:16px;
}

.header h1 {
  margin:0;
  font-size:24px;
}

.header-note {
  margin:0;
  color:#555;
  font-size:14px;
  text-align:right;
}

.controls {
  display:grid;
  grid-template-columns:300px 300px;
  gap:24px;
  justify-content:space-between;
}

.control label {
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

select {
  width:100%;
  padding:9px 10px;
  font-size:16px;
  border:1px solid #777;
  background:#fff;
}

.mapping {
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:560px;
}

.panel {
  position:relative;
  padding:25px 20px;
  overflow:hidden;
}

.panel + .panel {
  border-left:2px solid #222;
}

.panel h2 {
  margin:0;
  text-align:center;
  font-size:20px;
}

.device {
  text-align:center;
  margin-top:5px;
  color:#666;
  font-size:13px;
}

.stage {
  position:relative;
  width:400px;
  height:400px;
  max-width:100%;
  margin:10px auto 0;
}

.controller-outline {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  fill:#fafafa;
  stroke:#777;
  stroke-width:3;
}

.bar {
  stroke:#111;
  stroke-width:3;
}

.button {
  stroke:#111;
  stroke-width:3;
}

.button-label {
  font-size:12px;
  font-weight:bold;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.annotation-line {
  stroke:#444;
  stroke-width:2;
  stroke-dasharray:5 3;
}

.annotation-box {
  fill:none;
  stroke:#444;
  stroke-width:2;
  stroke-dasharray:5 3;
}

.annotation-text {
  font-size:12px;
  font-weight:bold;
  fill:#222;
}

.mode {
  position:absolute;
  right:8px;
  top:2px;
  color:#b97855;
  font-weight:bold;
  font-size:13px;
}

.no-map {
  padding:70px 20px;
  text-align:center;
  color:#777;
}

@media(max-width:750px) {
  .header-top { align-items:flex-start; flex-direction:column; }
  .header-note { text-align:left; }
  .controls { grid-template-columns:1fr; }
  .mapping { grid-template-columns:1fr; }
  .panel + .panel { border-left:0; border-top:2px solid #222; }
}
</style>
</head>

<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <h1>Bridge mapping simulator</h1>
   
    </div>

    <div class="controls">
      <div class="control">
        <label for="consoleSelect">Console</label>
        <select id="consoleSelect"></select>
      </div>
      <div class="control">
        <label for="controllerSelect">Connected Controller</label>
        <select id="controllerSelect"></select>
      </div>
    </div>
	<br>
   <p class="header-note">To change modes press (L + all face buttons + down/up)</p>
	</div>

  <div id="mapping" class="mapping">
    <section class="panel">

      <div class="device">Console controller</div>

    <section class="panel">
      <h2 id="controllerTitle"></h2>

      <div id="controllerStage" class="stage"></div>
    </section>
  </div>
</div>

        C105 95 145 70 195 85
        L230 100 L265 85
        C315 70 355 95 355 145
        L345 320
        C340 350 310 355 290 325
        L255 275 L205 275 L170 325
        C150 355 120 350 115 320 Z`;
      break;

    case "three":
      d = `
        M110 145
        C110 90 150 70 195 88
        L230 105 L265 88
        C310 70 350 90 350 145
        L340 320
        C335 350 305 355 285 325
        L250 275 L210 275 L175 325
        C155 355 125 350 120 320 Z`;
      break;

    case "tg16":
      d = `
        M90 135
        C90 90 135 70 180 85
        L230 100 L280 85
        C325 70 370 90 370 135
        L360 315
        C355 350 325 355 300 325
        L260 275 L200 275 L160 325
        C135 355 105 350 100 315 Z`;
      break;
  }

  if (d) {
    stage.appendChild(svgEl("path", {
      d:d,
      class:"controller-outline"
    }));
  }
}

function drawButton(stage,b,color) {

  if (b.shape === "triangle") {
    const s = 9;
    const points = {
      up:    `${b.x},${b.y-s} ${b.x-s},${b.y+s} ${b.x+s},${b.y+s}`,
      down:  `${b.x},${b.y+s} ${b.x-s},${b.y-s} ${b.x+s},${b.y-s}`,
      left:  `${b.x-s},${b.y} ${b.x+s},${b.y-s} ${b.x+s},${b.y+s}`,
      right: `${b.x+s},${b.y} ${b.x-s},${b.y-s} ${b.x-s},${b.y+s}`
    };
    stage.appendChild(svgEl("polygon",{
      points:points[b.direction], fill:color || b.color || "#fff", class:"button"
    }));
    return;
  }

  if (b.shape === "rectangle") {
    const w = 30;
    stage.appendChild(svgEl("rect",{
      x:b.x-w/2, y:b.y-7, width:w, height:14,
      rx:2, fill:color || b.color || "#fff", class:"button"
    }));
  } else if (b.shape === "trigger") {
    stage.appendChild(svgEl("rect",{
      x:b.x-19, y:b.y-8, width:38, height:16,
      rx:6, fill:color || b.color || "#fff", class:"button"
    }));
  } else if (b.shape === "analog") {
    stage.appendChild(svgEl("circle",{
      cx:b.x, cy:b.y, r:16,
      fill:color || b.color || "#ddd", class:"button"
    }));
  } else if (b.r) {
    stage.appendChild(svgEl("circle",{
      cx:b.x,cy:b.y,r:Math.max(7,b.r*0.76),
      fill:color || b.color || "#fff",
      class:"button"
    }));
  }

  if (b.label !== false && b.id && (b.label || b.r >= 17 || ["L","R","SELECT","START","RUN","Z","MODE"].includes(b.id))) {
    const t=svgEl("text",{
      x:b.x,y:b.y,
      class:"button-label"
    });
    t.textContent=b.label || (b.id === "START" ? "Srt" : b.id === "SELECT" ? "slc" : b.id === "MODE" ? "MOD" : b.id);
    stage.appendChild(t);
  }
}

function getButtonColor(button, colors, shapeName) {
  const mappedColor = colors?.[button.id]
    ?? colors?.controller?.[button.id]
    ?? colors?.console?.[button.id];

  if (mappedColor) return mappedColor;
  if (button.color) return button.color;
  if (shapeName === "n64" && N64_C_COLORS[button.id]) {
    return N64_C_COLORS[button.id];
  }
  return "#fff";
}

function drawAnnotations(svg, buttons, annotationKey, side) {
  const annotations = (ANNOTATIONS[annotationKey] || [])
    .filter(annotation => annotation.side === side);
  const buttonById = Object.fromEntries(buttons.map(button => [button.id, button]));

  for (const annotation of annotations) {
    if (annotation.note) {
      const text = svgEl("text", {
        x:annotation.x ?? 230,
        y:annotation.y ?? 25,
        "text-anchor":annotation.anchor || "middle",
        class:"annotation-text"
      });
      text.textContent=annotation.note;
      svg.appendChild(text);
      continue;
    }

    if (annotation.boxButtons) {
      const sources = annotation.boxButtons
        .map(buttonId => buttonById[buttonId])
        .filter(Boolean);
      if (sources.length !== annotation.boxButtons.length) continue;

      const padding = 14;
      const left = Math.min(...sources.map(button => button.x - button.r)) - padding;
      const top = Math.min(...sources.map(button => button.y - button.r)) - padding;
      const right = Math.max(...sources.map(button => button.x + button.r)) + padding;
      const bottom = Math.max(...sources.map(button => button.y + button.r)) + padding;
      const targetX = annotation.targetX ?? 405;
      const targetY = annotation.targetY ?? bottom;
      const textX = 445;
      const lines = annotation.lines || [annotation.text || ""];

      svg.appendChild(svgEl("rect", {
        x:left,
        y:top,
        width:right - left,
        height:bottom - top,
        rx:6,
        class:"annotation-box"
      }));
      svg.appendChild(svgEl("line", {
        x1:right,
        y1:bottom,
        x2:targetX,
        y2:targetY,
        class:"annotation-line"
      }));

      const text = svgEl("text", {
        x:textX,
        y:targetY - ((lines.length - 1) * 7),
        "text-anchor":"end",
        class:"annotation-text"
      });
      lines.forEach((line, index) => {
        const tspan = svgEl("tspan", {
          x:textX,
          dy:index === 0 ? 0 : 15
        });
        tspan.textContent=line;
        text.appendChild(tspan);
      });
      svg.appendChild(text);
      continue;
    }

    const source = buttonById[annotation.button];
    if (!source) continue;

    const targetX = 405;
    const targetY = annotation.targetY ?? source.y;
    const textX = 445;
    const lines = annotation.lines || [annotation.text || ""];

    svg.appendChild(svgEl("line", {
      x1:source.x,
      y1:source.y,
      x2:targetX,
      y2:targetY,
      class:"annotation-line"
    }));

    const text = svgEl("text", {
      x:textX,
      y:targetY - ((lines.length - 1) * 7),
      "text-anchor":"end",
      class:"annotation-text"
    });
    lines.forEach((line, index) => {
      const tspan = svgEl("tspan", {
        x:textX,
        dy:index === 0 ? 0 : 15
      });
      tspan.textContent=line;
      text.appendChild(tspan);
    });
    svg.appendChild(text);
  }
}

function renderSide(containerId, shapeName, colors, mode, positionOverrides, annotationKey, annotationSide) {

  const stage=document.getElementById(containerId);
  stage.innerHTML="";

  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 460 440");
  svg.setAttribute("width","100%");
  svg.setAttribute("height","100%");
  stage.appendChild(svg);

  const holder={
    appendChild:x=>svg.appendChild(x)
  };
 
  
  const backdropUrl = BACKDROP_URLS[SHAPES[shapeName].backdrop];
  if (backdropUrl) {
    svg.appendChild(svgEl("image",{
      href:backdropUrl,
      x:25, y:45, width:410, height:345,
      opacity:"0.14",
      preserveAspectRatio:"xMidYMid meet"
    }));
  }

  const rawButtons=positionOverrides?.[shapeName] || [];
  const buttons=Array.isArray(rawButtons)
    ? rawButtons
    : Object.entries(rawButtons).map(([id,button])=>({...button,id:id}));

  for (const b of buttons) {
    const color = getButtonColor(b, colors, shapeName);
    drawButton(holder,b,color);
  }

  drawAnnotations(svg, buttons, annotationKey, annotationSide);

}

function fillConsoleSelect() {

  const s=document.getElementById("consoleSelect");
  s.innerHTML="";

  for (const [id,data] of Object.entries(CONSOLES)) {
    const o=document.createElement("option");
    o.value=id;
    o.textContent=data.name;
    s.appendChild(o);
  }
}

function fillControllerSelect() {

  const consoleId=document.getElementById("consoleSelect").value;
  const s=document.getElementById("controllerSelect");

  s.innerHTML="";

  const available = Object.keys(MAPPER[consoleId + "_console"] || {});

  for (const id of available) {
    const data=CONTROLLERS[id];
    if (!data) continue;
    const o=document.createElement("option");
    o.value=id;
    o.textContent=data.name;
    s.appendChild(o);
  }
}

function render() {

  const consoleId=document.getElementById("consoleSelect").value;
  const controllerId=document.getElementById("controllerSelect").value;
  const consoleData=CONSOLES[consoleId];
  const controllerData=CONTROLLERS[controllerId];

  if (!consoleData || !controllerData) return;

  const consoleMap=MAPPER[consoleId+"_console"];
  const map=consoleMap?.[controllerId];

  document.getElementById("consoleTitle").textContent=consoleData.name;
  document.getElementById("controllerTitle").textContent=controllerData.name;

  if (!map) {
    document.getElementById("consoleStage").innerHTML=
      "<div class='no-map'>No mapping defined.</div>";
    document.getElementById("controllerStage").innerHTML="";
    return;
  }

  renderSide(
    "consoleStage",
    consoleData.shape,
    null,
    "",
    CONSOLE_POSITIONS,
    consoleId + "|" + controllerId,
    "console"
  );

  renderSide(
    "controllerStage",
    controllerData.shape,
    map,
    controllerData.mode,
    RIGHT_SIDE_POSITIONS,
    consoleId + "|" + controllerId,
    "controller"
  );
}

document.getElementById("consoleSelect")
  .addEventListener("change",()=>{
    fillControllerSelect();
    render();
  });

document.getElementById("controllerSelect")
  .addEventListener("change",render);

fillConsoleSelect();
document.getElementById("consoleSelect").value="n64";
fillControllerSelect();
document.getElementById("controllerSelect").value="sixButtonLR1";
render();

</script>
